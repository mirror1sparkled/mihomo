name: Sync Upstream Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release.yml'
      - '.github/scripts/sync-release.sh'

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mirror1sparkled/mihomo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mirror scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mirror latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sync-release.sh
