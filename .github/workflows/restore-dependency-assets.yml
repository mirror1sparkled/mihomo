name: Restore Dependency Assets

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Upstream owner/repository
        required: true
        type: string
      source_tag:
        description: Upstream release tag
        required: true
        type: string
      target_tag:
        description: Mirror release tag
        required: true
        type: string
      patterns:
        description: One asset glob per line
        required: true
        type: string

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Download whitelisted upstream assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATTERNS: ${{ inputs.patterns }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] || gh release download "$SOURCE_TAG" \
              --repo "$SOURCE_REPO" \
              --dir "$RUNNER_TEMP/assets" \
              --pattern "$pattern"
          done <<< "$PATTERNS"
          test -n "$(find "$RUNNER_TEMP/assets" -maxdepth 1 -type f -print -quit)"

      - name: Upload whitelisted mirror assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TARGET_TAG" "$RUNNER_TEMP/assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
