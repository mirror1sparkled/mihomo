name: Cleanup Legacy Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to recreate
        required: true
        type: string
      title:
        description: Title used when the release does not exist
        required: false
        type: string
      prerelease:
        description: Mark a newly created release as a prerelease
        required: false
        default: false
        type: boolean
      latest:
        description: Mark a newly created release as latest
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate release without assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_TITLE: ${{ inputs.title }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null); then
            TITLE=$(jq -r '.name // .tag_name' <<< "$RELEASE_JSON")
            PRERELEASE=$(jq -r '.prerelease' <<< "$RELEASE_JSON")
            RELEASE_ID=$(jq -r '.id' <<< "$RELEASE_JSON")
            LATEST_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id' 2>/dev/null || true)
            if [[ "$RELEASE_ID" == "$LATEST_ID" ]]; then
              LATEST=true
            else
              LATEST=false
            fi
            jq -r '.body // ""' <<< "$RELEASE_JSON" > "$NOTES_FILE"
            gh release delete "$TAG" --yes
          else
            TITLE=${INPUT_TITLE:-$TAG}
            PRERELEASE=$INPUT_PRERELEASE
            LATEST=$INPUT_LATEST
            : > "$NOTES_FILE"
          fi

          CREATE_ARGS=(
            "$TAG"
            --verify-tag
            --title "$TITLE"
            --notes-file "$NOTES_FILE"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            CREATE_ARGS+=(--prerelease)
          fi
          if [[ "$LATEST" == "true" ]]; then
            CREATE_ARGS+=(--latest)
          else
            CREATE_ARGS+=(--latest=false)
          fi

          gh release create "${CREATE_ARGS[@]}"
